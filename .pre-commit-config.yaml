repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
  - repo: local
    hooks:
      - id: nasmfmt-hook
        name: nasmfmt formatting
        entry: nasmfmt
        language: system
        files: \.asm$
        types: [text]
        args:
          [
            "-ii", "4",
            "-ci", "30"
          ]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.2
    hooks:
      - id: clang-format
        args: ["-style=file"]
